<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Dorks</title>
    <link rel="shortcut icon" type="image/png" href="assets/general/cyber.png">
    <style>
        body {
            background-color: #121317;
            color: #e2e2e2;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

		.wallpaper {
            background-image: url('assets/general/default-wallpaper.svg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 1;
            transition: opacity 0.5s ease-in-out;
        }
		
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        h3 a {
            color: #2ed8a2;
            text-decoration: none;
            transition: color 0.3s;
        }

        h3 a:hover {
            color: #d1aff8;
        }

        .table {
            margin-top: 20px;
            border-collapse: collapse;
            width: 100%;
        }

        .table th, .table td {
            padding: 10px;
            text-align: left;
            vertical-align: top;
        }

        .table th {
            background-color: #1e212b;
            color: #2ed8a2;
        }

        .table td {
            background-color: #1e212b;
        }

        .table ul {
			list-style-type: none;
			padding: 0;
		}

		.table ul li {
			margin-bottom: 15px; 
			padding-bottom: 10px; 
			border-bottom: 1px solid #444; 
			padding-left: 10px; /* Отступ слева */
		}

		.table ul ul {
			margin-top: 10px; /* Отступ сверху для подсписков */
		}

		.table ul ul li {
			padding-left: 0; /* Убираем отступ у подсписков */
		}

		.table ul li:has(ul) {
			padding: 10px; /* Внутренний отступ */
			background-color: #282c34; /* Фоновый цвет для разделов с подсписками */
			border-radius: 5px; /* Закругление углов */
			border: 1px solid #444; /* Граница */
			margin-bottom: 20px; /* Дополнительный отступ снизу для разделения */
		}

		.table a {
			color: #e2e2e2;
			text-decoration: none;
			transition: color 0.3s;
		}

		.table a:hover {
			color: #d1aff8;
		}
		
		@media (max-width: 768px) {
            body {
                display: block;
                padding: 10px;
            }

            .table-container {
                padding: 10px;
            }

            .table th, .table td {
                padding: 8px;
                display: block;
                width: 90%;
                box-sizing: border-box;
            }

            .table ul li {
                margin-bottom: 10px;
                padding-bottom: 8px;
            }

            .table ul li:has(ul) {
                margin-bottom: 15px;
            }
        }
    </style>
</head>
<body>
	<div class="wallpaper"></div>
    <div class="container">
        <h3><a href="../start.html">Google Dorks</a></h3>
        <figure class="table">

								<li>Поиск информации о погоде в заданной локации</li>
							</ul>
                        </td>
                        <td>
                            <ul>
                                <li>([term] or [operator])</li>
								<li>[text] * [text]</li>

                            </ul>
                        </td>
						<td>
                            <ul>

								<li>How to * a computer</li>

                        </td>
                    </tr>
                </tbody>
            </table>
        </figure>
    </div>
</body>
</html>
